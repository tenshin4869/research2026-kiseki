preprocessing:
  acc_smoothing_window: 10

step_detection:
  height: 12.0
  distance_s: 0.35
  prominence: 0.4

heading:
  gyro_axis: "z"
  gyro_sign: -1.0
  gyro_sign_overrides:
    hand_002_turnright: 1.0
  initial_heading_rad: 0.0
  use_bias_correction: true
  bias_static_duration_s: 2.0

pdr:
  step_length_m: 0.65

visualization:
  figure_dpi: 200
  equal_axis: true
  show_grid: true

smartpdr:
  preprocessing:
    hpf_alpha: 0.9
    moving_average_window: 5
    comparison_window_samples: 10
  step_detection:
    peak_threshold: 0.5
    peak_to_peak_threshold: 1.0
    min_step_interval_s: 0.3
  heading:
    gyro_sign: -1.0
    use_bias_correction: true
    bias_static_duration_s: 2.0
    initial_heading_rad: 0.0
    initial_heading_source: "magnetic"
    declination_deg: 0.0
    correlation_threshold_deg: 5.0
    mag_variation_threshold_deg: 2.0
    weight_prev: 2.0
    weight_mag: 1.0
    weight_gyro: 2.0
  step_length:
    mode: "dynamic"
    static_length_m: 0.65
    switch_threshold: 3.230
    root_beta: 1.479
    root_gamma: -1.259
    log_beta: 1.131
    log_gamma: 0.159
    min_length_m: 0.2
    max_length_m: 1.2
  output_dir: "outputs/smartpdr"
